name: iOS IPA

on:
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Build unsigned app
        run: |
          xcodebuild build \
          -project iosApp/iosApp.xcodeproj \
          -scheme iosApp \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -derivedDataPath ./build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGN_ENTITLEMENTS=""

      - name: Package IPA
        run: |
          mkdir -p payload-root/Payload
          cp -R build/Build/Products/Release-iphoneos/*.app payload-root/Payload/
          (cd payload-root && zip -qry ../PantsuTags-unsigned.ipa Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-unsigned
          path: PantsuTags-unsigned.ipa
